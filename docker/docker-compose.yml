# Scrye — hardened, CIS-aligned Compose stack (builds the image locally; released
# images are also published to GHCR — locked decision §6).
#
# Default `docker compose up` starts only the Scrye app. The optional sidecars
# (shared Trivy-DB cache, read-only Docker socket proxy) are gated behind Compose
# profiles and are wired up by later phases:
#   docker compose --profile trivy-server up
#   docker compose --profile docker-env up      # see the residual-risk note below
#
# RESOURCE LIMITS. Memory limits are set inline with `mem_limit`/`mem_reservation`
# rather than a Swarm-style `deploy:` block, because several NAS container
# platforms (Synology Container Manager, QNAP Container Station) reject or choke
# on `deploy:` even though Compose v2 honours it standalone. CPU limits are kept,
# but moved to an opt-in overlay so this file stays parseable everywhere:
#   docker compose -f docker-compose.yml -f docker-compose.cpu-limits.yml up -d
#
# MASTER KEY. Nothing to do before the first run: with no key supplied, Scrye
# generates one on first launch and persists it at /data/app_secret_key (mode
# 0600) on the scrye_data volume. BACK THAT FILE UP — every stored secret is
# encrypted with a key derived from it, and losing it makes them unrecoverable.
# An existing key file is always reused and never overwritten.
#
# For production, prefer supplying it as a Docker secret so the key does not sit
# on the same volume as the database it protects. Create it (NEVER commit it):
#   mkdir -p docker/secrets && openssl rand -base64 48 > docker/secrets/app_secret_key
#   chmod 600 docker/secrets/app_secret_key
# then uncomment the three `app_secret_key` blocks below (the service's
# SCRYE_APP_SECRET_KEY_FILE + secrets: entries, and the top-level secrets:).
# Note that a *set* SCRYE_APP_SECRET_KEY_FILE with no file at that path is a
# startup error, by design: Scrye refuses to substitute a different key, which
# would orphan every secret already stored under the real one.
#
# The docker-env profile additionally needs the host's docker group id, because
# the socket proxy runs unprivileged and must be in that group to read the
# socket:
#   export DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"

services:
  scrye:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: scrye:0.1.0 # built locally from docker/Dockerfile; released images publish to ghcr.io/tyler-rich/scrye (locked decision §6)
    user: "1000:1000"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    networks:
      - scrye_net
    ports:
      - "127.0.0.1:8089:8089" # behind Caddy; never bind 0.0.0.0
    # Docker's default SIGTERM->SIGKILL budget is 10s, which the in-process
    # worker/scheduler shutdown (drain grace + cancelling tasks whose cancel must
    # wait out a non-cancellable threaded flush/backup) can exceed — a busy
    # instance would be SIGKILLed mid-commit (CON-6). Give the graceful path room.
    stop_grace_period: 30s
    environment:
      - SCRYE_DATABASE_PATH=/data/scrye.db
      # Uncomment together with the two secrets: blocks to supply the master key
      # as a Docker secret instead of letting Scrye generate one on the data
      # volume (see the MASTER KEY note at the top of this file):
      # - SCRYE_APP_SECRET_KEY_FILE=/run/secrets/app_secret_key
      # Uncomment when the matching sidecar profile is enabled:
      # - SCRYE_TRIVY_SERVER_URL=http://trivy-server:4954
      # - SCRYE_DOCKER_PROXY_URL=http://docker-socket-proxy:2375
      #
      # HTTPS enforcement. Session cookies are Secure by default, and a browser
      # discards a Secure cookie on an http:// page — so over plain HTTP the
      # sign-in cannot take effect and Scrye refuses it with an explanation
      # rather than pretending to work. Behind a TLS-terminating reverse proxy
      # (the normal setup) leave this alone: have the proxy send
      # "X-Forwarded-Proto: https" and set SCRYE_FORWARDED_ALLOW_IPS to the
      # address it connects from. Uncomment ONLY for a deliberate plain-HTTP
      # LAN/evaluation deployment — the session cookie then travels in cleartext
      # and anyone on the network path can steal it (README "If you're not using
      # HTTPS"):
      # - SCRYE_SESSION_COOKIE_SECURE=false
    # secrets:
    #   - app_secret_key
    volumes:
      - scrye_data:/data
      - scrye_cache:/cache
    tmpfs:
      # Owned by the container uid (1000): a bare tmpfs is root-owned, so a
      # non-root process cannot write to it. Holds only the transient registry/
      # git credential files (materialized in-memory, never on disk); the
      # scanners' large DB/scratch writes go to the /cache volume, not here.
      # Deliberately small: tmpfs is RAM-backed, so its size counts against the
      # container's memory limit. Don't enlarge it to "fix" a scanner disk-space
      # error — vuln DBs and image-layer staging belong on /cache (see README
      # "Requirements" for the measured footprint and /cache sizing guidance).
      - /tmp:size=200m,mode=1700,uid=1000,gid=1000
    # Memory containment (CIS baseline): caps the OOM blast radius of a runaway
    # scan, and bounds the RAM-backed /tmp tmpfs above, which counts against this
    # limit. Expressed with the portable `mem_limit`/`mem_reservation` keys — see
    # the RESOURCE LIMITS note at the top of this file for why, and for the
    # opt-in CPU overlay.
    mem_limit: 2g
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8089/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: shared Trivy vulnerability-DB cache (enable with --profile trivy-server).
  #
  # RESIDUAL RISK (documented exception to the non-root baseline, audit INF-4):
  # this sidecar runs as root inside the container. The upstream aquasec/trivy
  # image ships no non-root USER and hard-codes its cache under /root/.cache;
  # running it as an arbitrary uid would leave that cache (a named volume Docker
  # creates root-owned) unwritable, breaking the DB download. The exposure is
  # bounded: the service is optional (profile-gated), reachable only on the
  # internal scrye_net (no host port), read-only root FS, no-new-privileges,
  # cap_drop ALL, and memory-limited (CPU too, under the opt-in
  # docker-compose.cpu-limits.yml overlay), so an in-container compromise cannot
  # escalate privileges or reach the host filesystem. A future hardening is to
  # rebuild trivy-server on a non-root base with a writable cache path.
  trivy-server:
    profiles: ["trivy-server"]
    image: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
    command: ["server", "--listen", "0.0.0.0:4954"]
    networks:
      - scrye_net
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    volumes:
      - trivy_cache:/root/.cache/trivy
    tmpfs:
      - /tmp
    mem_limit: 1g
    healthcheck:
      # The trivy binary is the image entrypoint; `version` is a cheap liveness probe.
      test: ["CMD", "trivy", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: read-only Docker socket proxy for "scan running images"
  # (enable with --profile docker-env). RESIDUAL RISK: this is the only place a
  # docker.sock mount is permitted; the Scrye app never mounts the socket
  # directly (locked decision #4, CIS 5.21/5.22).
  #
  # Migrated tecnativa/docker-socket-proxy -> wollomatic/socket-proxy (issue #63).
  # wollomatic is a from-scratch Go binary (no HAProxy, no shell, no libc, no
  # package manager) that runs as uid 65534 and allowlists requests by *regex per
  # HTTP method*, where tecnativa ran as root on haproxy:alpine and allowlisted by
  # coarse env-var toggles that each opened a whole path prefix. See
  # docs/ARCHIVE.md § Deviations (2026-07-24) for the full before/after allowlist
  # mapping.
  docker-socket-proxy:
    profiles: ["docker-env"]
    image: wollomatic/socket-proxy:1.12.3@sha256:74e770f5ed3cfc9ecb6350e177d2aa55873568c85bc953079834e68607dbf71b
    # The upstream image is `USER 65534:65534`. Unlike the old root-in-container
    # HAProxy image, this one must be given the *host's* docker GID to read the
    # socket at all: /var/run/docker.sock is root:docker mode 0660. Find it with
    #   stat -c '%g' /var/run/docker.sock
    # on the Docker host and set DOCKER_GID to match. Derive it, don't guess: the
    # 999 below is a placeholder, not a safe default — it was 989 on the Debian
    # host this was last verified against, where the fallback would have failed
    # outright. A wrong GID crash-loops this sidecar (it logs a socket permission
    # error, exits, and `restart: unless-stopped` restarts it into the same
    # failure — STATUS `Restarting`, never `Exited`); nothing else is affected.
    user: "65534:${DOCKER_GID:-999}"
    command:
      - "-loglevel=info"
      # Bind on the container interface so the app can reach it over scrye_net;
      # upstream defaults to 127.0.0.1 (secure-by-default, but unreachable here).
      # There is still no host port — the proxy is only exposed on scrye_net.
      - "-listenip=0.0.0.0"
      # Source allowlist: only the `scrye` service may connect. wollomatic
      # resolves the hostname through Compose's embedded DNS on every request and
      # compares it to the client IP, so nothing else on scrye_net (and nothing on
      # the host) can reach the socket. tecnativa had no source restriction at
      # all. If you rename the app service, change this to match, or fall back to
      # the network CIDR (e.g. `-allowfrom=172.16.0.0/12`); a mismatch fails
      # closed and logs `blocked request ... forbidden IP`.
      - "-allowfrom=scrye"
      # THE ALLOWLIST. Scrye issues exactly one request against this proxy —
      # `GET /images/json` (backend/app/core/docker_proxy.py) — so that is the
      # only thing permitted. wollomatic anchors the pattern with ^...$ itself and
      # matches it against the URL *path* only; the optional group accepts the
      # `/v1.NN` API-version prefix a docker CLI would send for the same endpoint.
      # No -allowHEAD/-allowPOST/-allowPUT/-allowPATCH/-allowDELETE is set, so
      # every other method is rejected with 405 before it reaches the socket.
      # This replaces IMAGES=1 + CONTAINERS=1 + INFO=1 (plus the image's default
      # EVENTS/PING/VERSION), which between them exposed /containers/{id}/json
      # (every container's env vars), /containers/{id}/archive (arbitrary file
      # read out of any container), /containers/{id}/export, /images/{n}/get, and
      # the whole /images and /containers prefixes. All of those are now denied.
      #
      # NOTE — the version group bounds the Docker API version at TWO digits
      # (`v1.0`–`v1.99`). The API is ~v1.51 today, so that is years of headroom,
      # but it is a hard bound, not an open range: if the Engine API ever reaches
      # v1.100, a client sending `/v1.100/images/json` stops matching and image
      # listing fails with a 403 that reads like a misconfigured allowlist rather
      # than a version-bound one. The fix then is to widen the quantifier here
      # (`{1,3}`) — and update the matching expectation in
      # backend/tests/test_compose_hardening.py. Don't widen it pre-emptively;
      # a tighter pattern is the point.
      - '-allowGET=(/v1\.[0-9]{1,2})?/images/json'
      # Opens a separate health listener on 127.0.0.1:55555 for the bundled
      # healthcheck binary. Deliberately *not* an allowlisted proxy endpoint: it
      # is why /info no longer has to be exposed just to have a liveness probe.
      - "-allowhealthcheck"
      # A Docker engine update can silently break the socket connection; check it
      # hourly and exit so `restart: unless-stopped` re-establishes it.
      - "-watchdoginterval=3600"
      - "-stoponwatchdog"
      - "-shutdowngracetime=5"
    networks:
      - scrye_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # documented residual risk
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    # No tmpfs. The old HAProxy image needed a writable /run for its pid/stats
    # socket under the read-only root FS (audit INF-5); this is a single static Go
    # binary with no writable path at all, so that carve-out is retired.
    # The highest-risk service (the only docker.sock mount) is capped so a
    # runaway/wedged proxy can't exhaust host resources (CIS baseline). 64M is
    # upstream's own suggested cap — the scratch image has no runtime to feed.
    # Its 0.5-CPU cap lives in the docker-compose.cpu-limits.yml overlay.
    mem_limit: 64m
    healthcheck:
      # The scratch image ships no shell/wget; upstream bundles a healthcheck
      # binary at / that probes the -allowhealthcheck listener (which in turn
      # verifies the docker socket is reachable).
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  scrye_net:
    driver: bridge

volumes:
  scrye_data:
  scrye_cache:
  trivy_cache:
# Uncomment together with the scrye service's `secrets:` and
# SCRYE_APP_SECRET_KEY_FILE lines to supply the master key as a Docker secret.
# Compose requires the file to exist at config time, which is why this is
# commented out by default — an absent file here fails `docker compose up`
# before the container ever starts.
# secrets:
#   app_secret_key:
#     file: ./secrets/app_secret_key # not committed; lives outside the image
