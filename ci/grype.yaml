# Scrye dogfood self-scan — Grype configuration for the CI image scan.
#
# The CI "image" job scans Scrye's own image with Grype and gates on FIXABLE
# findings at HIGH severity or above (`--only-fixed --fail-on high`). Per
# CLAUDE.md § Dependency hygiene, all fixable findings in Scrye's own attack
# surface must be resolved; only genuinely unfixable-by-us items may remain
# (documented in the README).
#
# The bundled trivy/grype/syft binaries are unmodified upstream Go binaries that
# Scrye cannot rebuild, so their embedded-module / Go-stdlib CVEs track upstream
# releases, not Scrye. They are excluded from the GATE here (by package location)
# and via `--exclude` on the command line, but remain visible in the informational
# report. The gate still covers the base image, OS packages (incl. git), Python
# and JS dependencies, and the app itself.
#
# NOTE: the base-image CPython interpreter binary is NOT blanket-excluded — it is
# scanned and gated like everything else. Specific interpreter CVEs that are
# unfixable on the current 3.14.x line are waived individually below, each with a
# review date and a tracking issue, rather than by excluding the binary wholesale.
#
# To triage a genuinely-fixable finding that cannot be resolved immediately, add
# a `vulnerability:` entry with a dated justification comment.

# Suppress Grype's own app-update check and match noise in CI output.
check-for-app-update: false

ignore:
  # Bundled upstream scanner binaries — see the note above.
  - package:
      location: "**/usr/local/bin/trivy"
  - package:
      location: "**/usr/local/bin/grype"
  - package:
      location: "**/usr/local/bin/syft"

  # ── CPython interpreter-binary CVEs on Python 3.14 — accepted risk ──────────────
  # The interpreter binary in python:3.14-slim-bookworm (3.14.6, current latest
  # 3.14.x) carries these. Background: docs/ARCHIVE.md §14 (2026-07-25, the
  # 3.13 → 3.14 runtime bump; 2026-07-26, the Group A re-verification and the
  # CVE-2025-15366 regrouping; 2026-07-30, the tarfile set). Each block cites its own
  # tracking issue below — they have different triggers and are not one decision.
  #
  # WHICH BLOCK IS TRACKED WHERE (read this before adding or removing an entry —
  # a single shared "tracked in #NN" header is what previously made two unrelated
  # decisions look like one; see docs/ARCHIVE.md §14, 2026-07-26 and 2026-07-30):
  #
  #   Group A-1 → issue #98   html.parser / getpath.py / imaplib   verified 2026-07-26
  #   Group A-2 → issue #116  tarfile (three CVEs)                 verified 2026-07-30
  #   Group B   → issue #52   poplib                               verified 2026-07-26
  #
  # A-1 and A-2 are both Group A and share the 3.14.7 trigger and the 2026-10-25
  # review date; they are separate issues because each carries its own dated
  # source-verification evidence, and folding them together would leave either
  # issue's evidence section not covering all of its own CVEs. Group B is a
  # different decision entirely — a standing acceptance, not a deferral.
  #
  # Group A-1 (issue #98) — fix merged to both the 3.13 and 3.14 maintenance branches but not yet
  # in any released point version, so it closes on the next 3.14.x point release
  # (3.14.7 — 3.14.6 released 2026-06-10, every backport below merged after it).
  # CVE-2026-15308 (HIGH) is the only one of the four that trips --fail-on high; the
  # rest are reported-but-non-gating Mediums, waived here for a clean report.
  #
  # Verified at the source on 2026-07-26, per CLAUDE.md § Dependency hygiene — not
  # taken from Grype's FIXED IN column, which still reports 3.15.x for all three.
  # Each file was diffed between the `3.14` branch and the `v3.14.6` tag; the branch
  # has each fix and 3.14.6 has none of them:
  #   - Lib/html/parser.py      buffered `feed()`/`_parse_threshold` rewrite
  #                             (python/cpython#153039, 2026-07-04)
  #   - Modules/getpath.py      BUILD_LANDMARK fallback removed
  #                             (python/cpython#151682, 2026-06-22)
  #   - Lib/imaplib.py          `_control_chars` guard in `IMAP4._command()`
  #                             (python/cpython#153137, 2026-07-07)
  # Expect the waivers to outlive 3.14.7 by a Grype-DB refresh cycle.
  #
  # Tracked in issue #98 (https://github.com/tyler-rich/Scrye/issues/98), which is
  # Group A only. Note CVE-2025-15366 was a Group B entry until 2026-07-26 — the
  # imaplib backport landed on 3.14 once the check was narrowed to NUL/CR/LF, so it
  # is no longer a below-3.15 acceptance. See docs/ARCHIVE.md §14 (2026-07-26).
  # REVIEW BY 2026-10-25 (covers the next 1-2 CPython point releases at their
  # ~2-month cadence, plus Grype-DB refresh lag on the backport).
  - vulnerability: CVE-2026-15308   # html.parser quadratic-complexity CPU DoS (HIGH)
  - vulnerability: CVE-2026-12003   # getpath.py in-tree search-path fallback (MEDIUM)
  - vulnerability: CVE-2025-15366   # imaplib command injection (MEDIUM)
  #
  # Group A-2 (issue #116) — the `tarfile` set. Same shape and same trigger as A-1:
  # each fix is merged to the `3.14` maintenance branch and absent from released
  # v3.14.6, so all three close on 3.14.7. Tracked separately from #98 because the
  # verification below was done on a different date against different files; see the
  # "WHICH BLOCK IS TRACKED WHERE" note above.
  #
  # These two HIGHs are what turned CI red on 2026-07-30 — they are new advisories,
  # not a regression in Scrye. CVE-2026-0864 is a reported-but-non-gating Medium,
  # waived alongside them for a clean report.
  #
  # Verified at the source on 2026-07-30, per CLAUDE.md § Dependency hygiene — NOT
  # from Grype's FIXED IN column, which reports 3.15.0b4 for all three and does not
  # record the 3.14 backports. Method: `git log -- Lib/tarfile.py` on the `3.14`
  # branch for the commits, `git merge-base --is-ancestor <commit> v3.14.6` for
  # release membership (all four: NOT an ancestor), plus a direct file diff.
  # v3.14.6 = commit c63aec6, released 2026-06-10:
  #   - CVE-2026-11972  _Stream.seek() now checks read()'s result (`if not data:
  #                     break`); 3.14.6 discards it → infinite loop at EOF (CWE-252).
  #                     e86666c, gh-151981/#151992, merged 2026-06-23 (+13d).
  #   - CVE-2026-11940  makelink_with_filter() re-filters against the hardlink's own
  #                     name before the symlink fallback; _extract() now passes
  #                     filter_function into _extract_one().
  #                     79c06bd, gh-151558/GH-151559, merged 2026-06-23 (+13d), and
  #                     5e0ef3f, gh-151987/#152609, merged 2026-06-29 (+19d).
  #   - CVE-2026-0864   _safe_read() + _EXTHEADER_READ_CHUNK bound the extended-header
  #                     read; 3.14.6 pre-allocates from the untrusted size field.
  #                     2cf26d0, gh-151497/GH-151979, merged 2026-06-24 (+14d).
  #
  # Scrye does not use tarfile: the string appears nowhere in the repo (backup
  # bundles are a JSON envelope, not tar), so the residual risk is unreachable
  # stdlib code in the image — the same rationale the poplib acceptance rests on.
  # REVIEW BY 2026-10-25 (aligned with #98 — same trigger, one review covers both).
  - vulnerability: CVE-2026-11940   # tarfile hardlink→symlink extraction escape (HIGH)
  - vulnerability: CVE-2026-11972   # tarfile streaming-mode EOF infinite loop (HIGH)
  - vulnerability: CVE-2026-0864    # tarfile oversized extended-header memory exhaustion (MEDIUM)
  #
  # Group B (issue #52) — ACCEPTED RISK ON ANY INTERPRETER BELOW 3.15. Not "pending an upgrade":
  # the fix exists only on `main`, upstream issue gh-143923 lists no backport PR for
  # any maintenance branch, and no 3.14.x point release will clear it. This is a
  # standing acceptance, not a deferral with a pending action behind it.
  #
  # Verified at the source on 2026-07-26: `POP3._putcmd()` in Lib/poplib.py raises on
  # `re.search(b'[\x00-\x1F\x7F]', line)` on `main` only — the `3.14` branch, the
  # `3.13` branch and the `v3.14.6` tag all still hand the line straight to
  # `_putline()` with no validation.
  #
  # This waiver covered imaplib as well until 2026-07-26. It no longer does: that
  # fix WAS backported and moved to Group A above. The two diverged because imaplib's
  # check was narrowed to NUL/CR/LF (python/cpython#153067), which cleared the
  # regression concern behind the original decline; poplib's still rejects the whole
  # [\x00-\x1F\x7F] range and has had no such narrowing.
  #
  # REVIEW ANNUALLY — next 2027-07-25. The review is a re-confirmation that the
  # acceptance still holds (severity unchanged, no backport appeared on the branch in
  # use, Scrye still doesn't use poplib), NOT a prompt to schedule a 3.15 move. A
  # 3.15 upgrade should be justified on support-lifecycle grounds if and when it
  # happens; per CLAUDE.md § Dependency hygiene, do not scope an interpreter bump as
  # a reaction to this one. Tracked in issue #52
  # (https://github.com/tyler-rich/Scrye/issues/52); see docs/ARCHIVE.md §14
  # (2026-07-25, 2026-07-26).
  - vulnerability: CVE-2025-15367   # poplib command injection (MEDIUM)
