[project]
name = "scrye"
version = "0.1.0"
description = "Self-hosted, browser-based web UI unifying the Trivy and Grype scanners."
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Scrye contributors" }]

# Pinned to specific, current, actively-maintained versions (see CLAUDE.md
# § Dependency hygiene). Bump deliberately, never float to `latest`.
dependencies = [
    "fastapi==0.139.0",
    # Pinned explicitly (a FastAPI transitive dep) to the version that fixes
    # CVE-2025-62727 / CVE-2026-48818 / CVE-2026-54283; FastAPI 0.139 allows it.
    "starlette==1.3.1",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "argon2-cffi==25.1.0",
    "cryptography==49.0.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "authlib==1.7.2",
    "pyotp==2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.8.6",
    "black==26.3.1",
]

# PEP 735 dependency group for the PEP 517 build backend. This exists so the
# build-system requirement (`setuptools`, below) flows through the same
# `uv pip compile --generate-hashes` process as the runtime deps and lands in
# `requirements.lock` hash-pinned — closing SC-12, the one build-time dependency
# the lockfile otherwise left floating/unhashed. The lock is regenerated with
# `--group build` (see CONTRIBUTING.md § Backend dependency lock and CI's drift
# gate), and the image builds the app package with `pip install --no-deps
# --no-build-isolation .` so it uses this hash-verified setuptools instead of
# fetching an unpinned copy in an isolated build environment.
[dependency-groups]
build = ["setuptools==83.0.0"]

[build-system]
# Pinned to an exact version (not `>=`) and hash-pinned in requirements.lock via
# the `build` dependency group above — keep the two setuptools pins in lockstep.
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, pyupgrade, flake8-bugbear, docstrings.
select = ["E", "F", "I", "N", "UP", "B", "D"]
# D203/D213 conflict with D211/D212; pick the common pair. D413 (blank line
# after the last docstring section) is purely cosmetic. B008 is the standard
# FastAPI dependency-injection idiom (Depends() in argument defaults).
ignore = ["D203", "D213", "D413", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests and migrations don't need full docstring coverage.
"tests/*" = ["D"]
"alembic/*" = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
