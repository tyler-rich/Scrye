# Reusable multi-arch build for the Scrye image.
#
# Single source of truth for QEMU + Buildx setup and the docker/Dockerfile
# build invocation, shared by ci.yml (build-only verification), publish.yml
# (build + push release tags to GHCR), and dev-nightly.yml (build + push the
# :dev tag to GHCR). Callers handle registry login before invoking this action
# with push: "true" — the action itself takes no secrets and stays
# registry-agnostic.
name: Build Scrye image
description: Set up QEMU + Buildx and build the multi-arch Scrye image, optionally pushing it.

inputs:
  platforms:
    description: Target platforms to build.
    required: false
    default: linux/amd64,linux/arm64
  push:
    description: Whether to push the built image to the registry ("true"/"false").
    required: false
    default: "false"
  tags:
    description: Newline- or comma-separated image tags (required when push is "true").
    required: false
    default: ""
  cache-scope:
    description: >-
      Primary GHA build-cache scope — this build WRITES (cache-to) to it and
      READS (cache-from) from it. Partitions the shared type=gha cache so builds
      with different platform sets (e.g. amd64-only vs multi-arch) don't evict
      each other's layers under the repo's 10 GB cache budget. Empty = buildx
      default. See docs/ARCHIVE.md § Build performance for the partitioning
      rationale — the scopes are separated on purpose; do not merge them.
    required: false
    default: ""
  extra-cache-scopes:
    description: >-
      Optional additional scopes this build READS from (cache-from only — never
      written). Comma/space/newline separated. Lets a build seed itself from a
      frequently-warm sibling scope (e.g. the nightly dev-multiarch cache) so a
      rarely-run multi-arch build isn't cold every time, WITHOUT writing a second
      scope (which would consume the 10 GB write budget the partitioning protects).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up QEMU (arm64 emulation)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build the cache-from (read: primary + every extra scope) and cache-to
    # (write: primary scope only) strings. Reads are cheap and don't grow the
    # cache; writing exactly one scope keeps the budget partitioning intact.
    - name: Compute build-cache configuration
      id: cache
      shell: bash
      env:
        PRIMARY_SCOPE: ${{ inputs.cache-scope }}
        EXTRA_SCOPES: ${{ inputs.extra-cache-scopes }}
      run: |
        set -euo pipefail
        from_lines=()
        if [ -n "${PRIMARY_SCOPE}" ]; then
          from_lines+=("type=gha,scope=${PRIMARY_SCOPE}")
          to_line="type=gha,mode=max,scope=${PRIMARY_SCOPE}"
        else
          from_lines+=("type=gha")
          to_line="type=gha,mode=max"
        fi
        # Split EXTRA_SCOPES on commas/whitespace/newlines; skip the primary and
        # any blanks/dupes.
        for scope in $(printf '%s' "${EXTRA_SCOPES}" | tr ',\n\t' '   '); do
          [ -n "${scope}" ] || continue
          [ "${scope}" != "${PRIMARY_SCOPE}" ] || continue
          from_lines+=("type=gha,scope=${scope}")
        done
        {
          echo "from<<EOF"
          printf '%s\n' "${from_lines[@]}"
          echo "EOF"
          echo "to=${to_line}"
        } >> "${GITHUB_OUTPUT}"

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        cache-from: ${{ steps.cache.outputs.from }}
        cache-to: ${{ steps.cache.outputs.to }}
