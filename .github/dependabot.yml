# Dependabot — keep the GitHub Actions supply chain current and reviewable.
#
# Part of audit finding INF-1: the workflows that hold the Docker Hub token
# should reference pinned, tracked action versions. Dependabot opens grouped PRs
# to bump the actions (in workflows and the composite build action), so a pinned
# SHA can be reviewed and rolled forward deliberately rather than silently
# resolving a mutable tag at run time.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Covers .github/workflows/* and the composite action under .github/actions/.
    directory: "/"
    # Open bumps against `dev`, not the default branch (`main`). Per the
    # branching model, `main` is protected and receives only deliberate `dev`->
    # `main` promotions; all routine work — including action bumps — flows
    # through `dev`. Without this, Dependabot targets the default branch (main),
    # so a bump lands on `main` and never reaches `dev`, leaving `dev` "behind".
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
