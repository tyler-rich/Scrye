# Dependabot — keep the full dependency supply chain current and reviewable:
# GitHub Actions, the Python backend, the npm frontend, and Docker base images.
#
# Part of audit finding INF-1: the publishing workflows push to GHCR with the
# built-in GITHUB_TOKEN (packages:write), so their actions should reference
# pinned, tracked versions. Dependabot opens grouped PRs to bump the actions (in
# workflows and the composite build action), so a pinned SHA can be reviewed and
# rolled forward deliberately rather than silently resolving a mutable tag at run
# time.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Covers .github/workflows/*. Dependabot's github-actions ecosystem only
    # scans workflow files under the given directory, not composite actions
    # nested elsewhere in the repo — the composite build action needs its own
    # entry below (compliance finding D3; see docs/ARCHIVE.md §15).
    directory: "/"
    # Open bumps against `dev`, not the default branch (`main`). Per the
    # branching model, `main` is protected and receives only deliberate `dev`->
    # `main` promotions; all routine work — including action bumps — flows
    # through `dev`. Without this, Dependabot targets the default branch (main),
    # so a bump lands on `main` and never reaches `dev`, leaving `dev` "behind".
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    # The reusable composite action's `uses:` refs live outside .github/workflows/
    # and need their own directory entry to be scanned (compliance finding D3,
    # docs/ARCHIVE.md §15 — the single "/" entry above does not reach this
    # file).
    directory: "/.github/actions/build-image"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "backend"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "frontend"
    # Mantine v7 and React 18 are LOCKED (CLAUDE.md locked decision §2: "React 18
    # + TS + Vite + Mantine v7"). A major bump on either is a re-opening of a
    # locked decision, not a dependency update, so Dependabot must not propose
    # one — a grouped PR that contains an unmergeable major has to be closed by
    # hand, and closing it discards the mergeable bumps grouped alongside it.
    # These ignores keep the frontend group mergeable; lifting them is a
    # deliberate decision made with the user first, not a Dependabot PR.
    #
    # Minor/patch updates within v7 / React 18 are NOT ignored and still flow.
    # @types/react* are majors-locked too because their major tracks React's:
    # @types/react 19 against react 18 breaks the type-aware ESLint gate.
    #
    # @types/node is majors-locked for the SAME reason, against a different
    # runtime: its major tracks Node's, and this repo builds and runs on Node 24
    # (docker/Dockerfile's builder stage, ci.yml's `node-version`), with Node
    # majors already declined on a support-lifecycle argument in the `docker`
    # entry below. tsconfig.node.json sets `"types": ["node"]`, so a @types/node
    # ahead of the pinned runtime describes APIs the build does not have and
    # feeds them straight into the type-aware ESLint gate. #145 proposed
    # @types/node 26 against Node 24; 24.x was applied instead. Lifting this line
    # is part of moving the Node major, not a bump to take on its own.
    #
    # Deliberately NOT ignored: the frontend tooling majors (typescript, eslint,
    # typescript-eslint, vite, vitest, jsdom and friends). Those are *wanted* —
    # they are the deferred #86 sweep tracked in docs/ROADMAP.md — so Dependabot
    # should keep surfacing them until that PR is done. An ignore rule says "a
    # bot may not make this decision"; it is not a parking space for work we
    # intend to do.
    ignore:
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    # Covers the multi-stage docker/Dockerfile base images (node, debian,
    # python).
    directory: "/docker"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    ignore:
      # Node MAJOR bumps are declined here on a support-lifecycle argument, not
      # a preference. The builder is on 24 (`krypton`), the Active LTS, which is
      # supported through 2028-04-30 — the longest window available today.
      # Node's odd-numbered lines never become LTS: 25 (proposed as #126)
      # reached end-of-life on 2026-06-01, so taking it would have moved the
      # build onto an UNSUPPORTED runtime, not extended anything. Node 26 does
      # not enter LTS until 2026-10-28; it is a deliberate decision to make
      # after that date, not a bump to accept from a PR. A major here also
      # spans three files that must change together (this Dockerfile stage,
      # ci.yml's `node-version`, and the CONTRIBUTING/README requirement), so it
      # is not something a Dependabot bump can carry regardless.
      #
      # Scoped to `version-update:semver-major` on purpose: DIGEST refreshes of
      # the pinned `node:24-bookworm-slim` tag are NOT a semver version update
      # and still come through. That matters — declining the major previously
      # left Dependabot offering nothing at all for this image and the pinned
      # digest went stale until it was refreshed by hand in #107
      # (docs/ARCHIVE.md §14, 2026-07-26).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # `scrye` is Scrye's OWN local build tag, not a registry dependency — see
      # the docker-compose entry below, which is the entry that actually scans
      # the file carrying it. Repeated here because the failing run is surfaced
      # under one of these two ecosystems and the distinction is not visible
      # from the repository; suppressing a name the Dockerfile never references
      # is a no-op.
      - dependency-name: "scrye"
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    # Covers sidecar images pinned in docker-compose.yml (e.g. the
    # docker-socket-proxy sidecar).
    directory: "/docker"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    ignore:
      # docker/docker-compose.yml pins `image: scrye:0.3.0` — Scrye's own image,
      # BUILT LOCALLY from docker/Dockerfile by whoever runs the stack. It is not
      # a registry dependency: released images publish to
      # ghcr.io/tyler-rich/scrye (locked decision §6). Dependabot cannot know
      # that, so it resolves the unqualified name as Docker Hub's
      # `library/scrye`, gets a 401, and fails the whole run with
      # `private_source_authentication_failure`.
      #
      # Ignoring the name is the fix. The alternatives were rejected: qualifying
      # the tag as ghcr.io/tyler-rich/scrye:0.3.0 would make the compose file
      # PULL a published image instead of building locally, changing what the
      # documented quick start does, and dropping the tag loses the version pin.
      # See docs/ARCHIVE.md §14, 2026-08-02.
      - dependency-name: "scrye"
    groups:
      docker-images:
        patterns:
          - "*"
