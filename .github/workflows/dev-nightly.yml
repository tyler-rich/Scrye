# Scrye — dev branch nightly image build (GHCR).
#
# The moving :dev tag is published to the GitHub Container Registry (GHCR) at
# ghcr.io/tyler-rich/scrye:dev — the SAME package that publish.yml pushes the
# release :latest/:<version> tags to (CLAUDE.md locked decision §6). This
# workflow builds the current dev branch once a night and overwrites :dev (not a
# version, not :latest), so HEAD-of-dev can be pulled and tested without cutting
# a release.
#
# Cadence rationale: dev images used to be rebuilt (multi-arch, arm64 under QEMU)
# on every merge into dev, which was the largest CI-minute cost relative to
# frequency. They are now batched to one nightly build, skipped entirely when dev
# has had no new commits in the last 24h. Immediate per-PR feedback is unchanged:
# ci.yml still lints, tests, and builds the amd64 image on every dev PR.
#
# Auth uses the built-in GITHUB_TOKEN (always available, no PAT, no long-lived
# registry secret). Because this is a schedule/dispatch trigger — not a
# pull_request one — it always runs in the base-repo context with a token, so
# there is no fork-PR secrets gap (audit INF-2 is fully retired now that release
# publishing also uses GITHUB_TOKEN → GHCR; see docs/ARCHIVE.md § Deviations).
name: Dev Nightly Build

on:
  # 04:00 UTC nightly — off-hours; the build is skipped if dev has no new commits.
  schedule:
    - cron: "0 4 * * *"
  # Manual force-build (always builds, ignores the freshness check).
  workflow_dispatch:

# GHCR push needs packages:write on GITHUB_TOKEN; contents:read to check out dev.
permissions:
  contents: read
  packages: write

# One nightly at a time; a manual dispatch supersedes an in-flight run.
concurrency:
  group: dev-nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: dev branch → GHCR (:dev nightly build)
    # Never run on forks (scheduled workflows run on forks that enable Actions).
    if: github.repository == 'tyler-rich/Scrye'
    runs-on: ubuntu-latest
    # Job-level least privilege: base contents:read + packages:write plus the two
    # scopes the GitHub-signed provenance attestation needs (SC-4).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          # No later step needs the checkout's git remote credentialed; drop
          # the persisted token so it never lingers in .git/config (SC-11).
          persist-credentials: false

      # Scheduled runs skip the (expensive multi-arch) build when dev's tip has
      # not moved in the last 24h. workflow_dispatch has no freshness step, so
      # steps.freshness.outputs.skip is empty there and every gated step runs.
      - name: Skip build if dev has no new commits in 24h (scheduled only)
        if: github.event_name == 'schedule'
        id: freshness
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE=$(( NOW - LAST_COMMIT ))
          if [ "$AGE" -gt 86400 ]; then
            echo "dev HEAD is ${AGE}s old (> 24h); skipping nightly build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev HEAD is ${AGE}s old (<= 24h); building."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.freshness.outputs.skip != 'true'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch (amd64 + arm64) so the :dev image runs on both deployment
      # targets. WRITEs its own GHA cache scope (dev-multiarch) so it doesn't
      # evict the amd64-only CI build cache; also READs the release multiarch
      # scope so a recent tagged release seeds this build symmetrically. This is
      # the build that keeps dev-multiarch warm for everything else to read from
      # (see docs/ARCHIVE.md § Build performance).
      - name: Build and push (:dev)
        id: build
        if: steps.freshness.outputs.skip != 'true'
        uses: ./.github/actions/build-image
        with:
          push: "true"
          tags: ghcr.io/tyler-rich/scrye:dev
          cache-scope: dev-multiarch
          extra-cache-scopes: multiarch
          # Attach BuildKit SLSA provenance + SPDX SBOM to the image manifest (SC-4).
          provenance: mode=max
          sbom: "true"

      # GitHub-signed SLSA build provenance for the :dev image (SC-4), verifiable
      # with `gh attestation verify oci://ghcr.io/tyler-rich/scrye:dev`.
      - name: Attest build provenance
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/tyler-rich/scrye
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
