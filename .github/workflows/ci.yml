# Scrye CI — baseline lint + test pipeline.
#
# This is the CI baseline all future phases build on: add new jobs/steps here as
# the app grows (e.g. the Phase 6 dogfood self-scan that runs Trivy + Grype
# against Scrye's own image). CI itself never publishes — it lints, tests, and
# proves the image builds for both architectures. Registry publishing to GHCR
# lives in the separate publish.yml (release tags → :latest/:<version>) and
# dev-nightly.yml (nightly dev build → :dev) workflows (CLAUDE.md locked
# decision §6).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token; CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here pushes or authenticates to the remote (CI is
          # contents: read), so drop the persisted token rather than leave it
          # in .git/config for later steps (SC-11).
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint — ruff
        run: ruff check .

      - name: Format — black
        run: black --check .

      - name: Check .env.example is in sync with Settings
        run: python -m scripts.gen_env_example --check

      # requirements.lock is the hash-pinned transitive closure the image installs
      # from (docker/Dockerfile, SC-1). Regenerate it with the pinned uv and fail
      # if it drifts from pyproject.toml — uv reads the existing lock as a
      # preference set, so an unrelated new transitive release does NOT rewrite it;
      # only a real pyproject dependency change does. The `--group build` flag pulls
      # the PEP 517 build backend (setuptools) into the same hash-pinned closure so
      # no build-time dependency floats (SC-12). Keep the uv pin and the compile
      # flags identical to CONTRIBUTING.md § Backend dependency lock.
      - name: Check requirements.lock is in sync with pyproject.toml
        run: |
          pip install uv==0.8.17
          uv pip compile pyproject.toml --group build --generate-hashes --python-version 3.14 \
            --output-file requirements.lock --quiet
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock is out of sync with pyproject.toml. Regenerate it with: uv pip compile pyproject.toml --group build --generate-hashes --python-version 3.14 --output-file requirements.lock" >&2
            exit 1
          fi

      - name: Tests — pytest
        run: pytest -q

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here pushes or authenticates to the remote (CI is
          # contents: read), so drop the persisted token rather than leave it
          # in .git/config for later steps (SC-11).
          persist-credentials: false

      # Keep this major in lockstep with docker/Dockerfile's `frontend-builder`
      # base — CI and the image must build the SPA on the same Node line.
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint

      - name: Format — Prettier
        run: npm run format:check

      - name: Tests — Vitest
        run: npm test

      # Type-checks (tsc) and bundles the SPA.
      - name: Build
        run: npm run build

  # Phase 6: build the image and dogfood Scrye's own scanners against it
  # (CLAUDE.md § Dependency hygiene). The scan covers the whole image filesystem
  # and OS package set, so the bundled THIRD_PARTY_LICENSES/ directory and the
  # `git` runtime dependency (added in Phase 3) are included automatically. The
  # gate fails on any FIXABLE HIGH/CRITICAL finding; fixable lower-severity items
  # are reported (non-gating) and genuinely unfixable items are noted in the
  # README. Triaged exceptions live in ci/trivyignore and ci/grype.yaml. Still
  # NO registry publishing (locked decision §6) — the image is only loaded/saved
  # locally within the job.
  image:
    name: Image — build + dogfood self-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here pushes or authenticates to the remote (CI is
          # contents: read), so drop the persisted token rather than leave it
          # in .git/config for later steps (SC-11).
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (amd64) and load
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: scrye:ci
          load: true
          # WRITE a dedicated amd64-only scope so this build and the multi-arch
          # builds (image-multiarch, publish, dev-nightly) don't evict each
          # other's layers under the repo's 10 GB GHA cache budget. Additionally
          # READ the nightly multi-arch scope (dev-multiarch): its amd64 layers
          # are reusable by this amd64-only build and are refreshed daily, so a
          # per-PR dogfood build seeds from them instead of rebuilding cold.
          # See docs/ARCHIVE.md § Build performance.
          cache-from: |
            type=gha,scope=amd64-ci
            type=gha,scope=dev-multiarch
          cache-to: type=gha,mode=max,scope=amd64-ci

      # SC-14: the runtime image must not ship the backend test suite or dev
      # scripts (root .dockerignore excludes them from the build context), and
      # must still carry the trees the runtime actually needs (app package +
      # Alembic migrations). Assert both against the real built image so a future
      # change that reintroduces those dev-only trees fails the gate.
      - name: Verify runtime image excludes dev-only trees (SC-14)
        run: |
          docker run --rm --entrypoint sh scrye:ci -c '
            set -e
            for p in /app/backend/tests /app/backend/scripts; do
              if [ -e "$p" ]; then
                echo "::error::$p is present in the runtime image (SC-14 regression)" >&2
                exit 1
              fi
            done
            for p in /app/backend/app /app/backend/alembic /app/backend/alembic.ini; do
              if [ ! -e "$p" ]; then
                echo "::error::$p is missing from the runtime image" >&2
                exit 1
              fi
            done
            echo "SC-14 OK: backend/tests and backend/scripts absent; runtime trees present"
          '

      - name: Export image to a tar for offline scanning
        run: docker save scrye:ci -o /tmp/scrye-image.tar

      # Trivy pinned to the version Scrye bundles (docs/ARCHIVE.md § Deviations).
      # Informational only (never gates) — run on pushes to main, not on PRs, so
      # dev PRs pay for just the two gate scans below. Full visibility is kept on
      # main and on release-bound history. (docs/ARCHIVE.md § Deviations, 2026-07-06.)
      - name: Trivy — full report (informational)
        if: github.event_name == 'push'
        run: |
          docker run --rm \
            -v /tmp/scrye-image.tar:/image.tar:ro \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image --input /image.tar \
            --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL --no-progress || true

      # The gate scans Scrye's own attack surface (OS packages incl. git, Python
      # and JS deps, app code) but SKIPS the bundled trivy/grype/syft binaries:
      # they are unmodified upstream Go binaries Scrye cannot rebuild, so their
      # embedded-module / Go-stdlib CVEs track upstream's release cadence, not
      # Scrye's. They remain visible in the informational report above and are
      # documented in the README. See docs/ARCHIVE.md § Deviations.
      - name: Trivy — gate on fixable HIGH/CRITICAL (excl. bundled scanners)
        run: |
          docker run --rm \
            -v /tmp/scrye-image.tar:/image.tar:ro \
            -v "${{ github.workspace }}/ci/trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image --input /image.tar \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --skip-files usr/local/bin/trivy \
            --skip-files usr/local/bin/grype \
            --skip-files usr/local/bin/syft \
            --ignorefile /.trivyignore --exit-code 1 --no-progress

      # Grype informational report (does not fail the build) — keeps the excluded
      # base-image / bundled-binary findings visible in the CI output. Gated to
      # pushes to main (not PRs) alongside the Trivy informational report above.
      - name: Grype — full report (informational)
        if: github.event_name == 'push'
        run: |
          docker run --rm \
            -v /tmp/scrye-image.tar:/image.tar:ro \
            anchore/grype:v0.115.0@sha256:decd87500a90c1e4faa1706f77b0b2cbc1d2f9364e976f1898ce9037de09cc3a docker-archive:/image.tar -o table || true

      # Grype gate. Excludes only the bundled trivy/grype/syft binaries (see the
      # Trivy gate note above); the base-image CPython interpreter is scanned and
      # gated like everything else, with individual unfixable interpreter CVEs
      # waived by ID in ci/grype.yaml rather than the binary being excluded
      # wholesale. Trivy's OS-aware scan also gates the base image. See
      # docs/ARCHIVE.md § Deviations.
      #
      # Two outputs from ONE invocation: `-o table` keeps the human verdict on
      # stdout ("No vulnerabilities found" when nothing real matched), and
      # `-o json=` writes the machine-readable report the "Waived by
      # ci/grype.yaml" step below reads. This is deliberately not a second
      # `docker run`: a second invocation would repeat the vulnerability-DB load
      # and the whole scan, and this job is already the slowest in CI.
      # See docs/ARCHIVE.md § Deviations (2026-07-31).
      - name: Grype — gate on fixable High+ (excl. bundled scanners)
        run: |
          mkdir -p /tmp/grype-out && chmod 777 /tmp/grype-out
          docker run --rm \
            -v /tmp/scrye-image.tar:/image.tar:ro \
            -v "${{ github.workspace }}/ci/grype.yaml:/.grype.yaml:ro" \
            -v /tmp/grype-out:/out \
            anchore/grype:v0.115.0@sha256:decd87500a90c1e4faa1706f77b0b2cbc1d2f9364e976f1898ce9037de09cc3a docker-archive:/image.tar \
            --only-fixed --fail-on high -c /.grype.yaml \
            -o table -o json=/out/grype-gate.json \
            --exclude '/usr/local/bin/trivy' \
            --exclude '/usr/local/bin/grype' \
            --exclude '/usr/local/bin/syft'

      # Non-gating. Prints exactly the CVEs waived by ci/grype.yaml's
      # `vulnerability:` entries, read from the JSON the gate step already wrote
      # — same scan, no second DB load.
      #
      # Why the filter is needed: Grype implements `--only-fixed` as an ignore
      # rule too, so `ignoredMatches` also contains every won't-fix / unfixed
      # package the gate deliberately filters out (~250 rows on this image, vs.
      # our 7 waivers). A bare `--show-suppressed` therefore buries the waivers
      # in noise AND replaces the verdict line with a table. Selecting only
      # entries whose appliedIgnoreRules carry a `vulnerability` key keeps the
      # by-ID waivers and drops both the --only-fixed set and the
      # location-based bundled-binary rules.
      #
      # `if: always()` so the waiver list still prints when the gate fails —
      # that is exactly when you want to know what was already excused.
      - name: Waived by ci/grype.yaml (informational)
        if: always()
        run: |
          report=/tmp/grype-out/grype-gate.json
          if [ ! -f "$report" ]; then
            echo "No Grype JSON report at $report — the gate step produced none."
            exit 0
          fi
          echo "Waived by ci/grype.yaml — deliberate exceptions, NOT findings."
          echo "Blocks: A-1 (issue #98) · A-2 (issue #116) · B (issue #52)"
          echo
          jq -r '
            .ignoredMatches[]
            | select(any(.appliedIgnoreRules[]?; has("vulnerability")))
            | "  \(.vulnerability.id)  \(.vulnerability.severity)  \(.artifact.name) \(.artifact.version)"
          ' "$report" | sort -u
          echo
          echo "Total waived: $(jq '[.ignoredMatches[]
            | select(any(.appliedIgnoreRules[]?; has("vulnerability")))
            | .vulnerability.id] | unique | length' "$report")"

  # Phase 6: prove the image builds for both target architectures
  # (linux/amd64 + linux/arm64, docs/ARCHIVE.md §9.1). No load/push — a multi-arch
  # build cannot be loaded into the local daemon, so this only verifies both
  # platforms build cleanly (the arm64 scanner-download path included). Uses the
  # shared build action that publish.yml also drives, so the build invocation
  # stays defined in exactly one place.
  #
  # Gated to main pushes and PRs whose base is main. The arm64 leg runs the whole
  # Dockerfile under QEMU emulation, so on a cold `type=gha` cache it takes hours;
  # only main-scoped runs reliably restore a warm arm64 cache, whereas dev-based
  # PRs would rebuild from scratch every time. Multi-arch buildability stays
  # continuously proven for dev anyway: dev-nightly.yml builds amd64+arm64 nightly
  # (the :dev tag) and publish.yml builds both on release tags. dev PRs still get
  # the fast amd64-only `image` build + dogfood self-scan above. See
  # docs/ARCHIVE.md § Deviations.
  image-multiarch:
    name: Image — multi-arch build check
    runs-on: ubuntu-latest
    # Skip on dev-based PRs (see note above); run on main pushes and PRs to main.
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here pushes or authenticates to the remote (CI is
          # contents: read), so drop the persisted token rather than leave it
          # in .git/config for later steps (SC-11).
          persist-credentials: false

      - name: Build image (amd64 + arm64, no push)
        uses: ./.github/actions/build-image
        with:
          platforms: linux/amd64,linux/arm64
          push: "false"
          # WRITE the multiarch scope; also READ the nightly dev-multiarch scope.
          # main content is promoted dev, so the nightly build (refreshed daily)
          # usually carries bit-identical base/apt/venv/npm-ci layers — reading it
          # means this rarely-run check restores warm arm64 layers (skipping the
          # QEMU rebuild) instead of being cold every time it fires. See
          # docs/ARCHIVE.md § Build performance.
          cache-scope: multiarch
          extra-cache-scopes: dev-multiarch
