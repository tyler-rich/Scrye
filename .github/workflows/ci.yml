# Scrye CI — baseline lint + test pipeline.
#
# This is the CI baseline all future phases build on: add new jobs/steps here as
# the app grows (e.g. the Phase 6 dogfood self-scan that runs Trivy + Grype
# against Scrye's own image). CI itself never publishes — it lints, tests, and
# proves the image builds for both architectures. Registry publishing to Docker
# Hub lives in the separate publish.yml workflow, gated on tagged main releases
# and dev-branch pushes (CLAUDE.md locked decision §6).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token; CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint — ruff
        run: ruff check .

      - name: Format — black
        run: black --check .

      - name: Check .env.example is in sync with Settings
        run: python -m scripts.gen_env_example --check

      - name: Tests — pytest
        run: pytest -q

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint

      - name: Format — Prettier
        run: npm run format:check

      # Type-checks (tsc) and bundles; also the frontend test entrypoint as the
      # suite grows (`npm test` can be added here in a later phase).
      - name: Build
        run: npm run build

  # Phase 6: build the image and dogfood Scrye's own scanners against it
  # (CLAUDE.md § Dependency hygiene). The scan covers the whole image filesystem
  # and OS package set, so the bundled THIRD_PARTY_LICENSES/ directory and the
  # `git` runtime dependency (added in Phase 3) are included automatically. The
  # gate fails on any FIXABLE HIGH/CRITICAL finding; fixable lower-severity items
  # are reported (non-gating) and genuinely unfixable items are noted in the
  # README. Triaged exceptions live in ci/trivyignore and ci/grype.yaml. Still
  # NO registry publishing (locked decision §6) — the image is only loaded/saved
  # locally within the job.
  image:
    name: Image — build + dogfood self-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64) and load
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: scrye:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image to a tar for offline scanning
        run: docker save scrye:ci -o /tmp/scrye-image.tar

      # Trivy pinned to the version Scrye bundles (docs/PLAN.md § Deviations).
      - name: Trivy — full report (informational)
        run: |
          docker run --rm \
            -v /tmp/scrye-image.tar:/image.tar:ro \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image --input /image.tar \
            --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL --no-progress || true

      # The gate scans Scrye's own attack surface (OS packages incl. git, Python
      # and JS deps, app code) but SKIPS the bundled trivy/grype/syft binaries:
      # they are unmodified upstream Go binaries Scrye cannot rebuild, so their
      # embedded-module / Go-stdlib CVEs track upstream's release cadence, not
      # Scrye's. They remain visible in the informational report above and are
      # documented in the README. See docs/PLAN.md § Deviations.
      - name: Trivy — gate on fixable HIGH/CRITICAL (excl. bundled scanners)
        run: |
          docker run --rm \
            -v /tmp/scrye-image.tar:/image.tar:ro \
            -v "${{ github.workspace }}/ci/trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image --input /image.tar \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --skip-files usr/local/bin/trivy \
            --skip-files usr/local/bin/grype \
            --skip-files usr/local/bin/syft \
            --ignorefile /.trivyignore --exit-code 1 --no-progress

      # Grype informational report (does not fail the build) — keeps the excluded
      # base-image / bundled-binary findings visible in the CI output.
      - name: Grype — full report (informational)
        run: |
          docker run --rm \
            -v /tmp/scrye-image.tar:/image.tar:ro \
            anchore/grype:v0.115.0@sha256:decd87500a90c1e4faa1706f77b0b2cbc1d2f9364e976f1898ce9037de09cc3a docker-archive:/image.tar -o table || true

      # Grype gate. Excludes only the bundled trivy/grype/syft binaries (see the
      # Trivy gate note above); the base-image CPython interpreter is no longer
      # excluded now that Scrye runs on Python 3.13, whose current patch release
      # carries the interpreter-CVE fixes. Trivy's OS-aware scan also gates the
      # base image. See docs/PLAN.md § Deviations.
      - name: Grype — gate on fixable High+ (excl. bundled scanners)
        run: |
          docker run --rm \
            -v /tmp/scrye-image.tar:/image.tar:ro \
            -v "${{ github.workspace }}/ci/grype.yaml:/.grype.yaml:ro" \
            anchore/grype:v0.115.0@sha256:decd87500a90c1e4faa1706f77b0b2cbc1d2f9364e976f1898ce9037de09cc3a docker-archive:/image.tar \
            --only-fixed --fail-on high -c /.grype.yaml \
            --exclude '/usr/local/bin/trivy' \
            --exclude '/usr/local/bin/grype' \
            --exclude '/usr/local/bin/syft'

  # Phase 6: prove the image builds for both target architectures
  # (linux/amd64 + linux/arm64, docs/PLAN.md §9.1). No load/push — a multi-arch
  # build cannot be loaded into the local daemon, so this only verifies both
  # platforms build cleanly (the arm64 scanner-download path included). Uses the
  # shared build action that publish.yml also drives, so the build invocation
  # stays defined in exactly one place.
  image-multiarch:
    name: Image — multi-arch build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (amd64 + arm64, no push)
        uses: ./.github/actions/build-image
        with:
          platforms: linux/amd64,linux/arm64
          push: "false"
