# Scrye — Docker Hub publishing (releases only).
#
# Docker Hub (<dockerhub-user>/scrye) is now RELEASE-ONLY (CLAUDE.md locked
# decision §6). A push of a semver tag (v*.*.*) builds the multi-arch image and
# pushes it as <dockerhub-user>/scrye:<version> (the tag without its leading "v")
# and <dockerhub-user>/scrye:latest. The release job refuses to run unless the
# tagged commit is reachable from main, so only real releases cut from main ever
# reach :<version>/:latest.
#
# Dev images are NOT published here — they go to GHCR (ghcr.io/iamgroot60/scrye:dev)
# via .github/workflows/dev-nightly.yml, which uses the built-in GITHUB_TOKEN.
# Docker Hub credentials are referenced only by this release workflow.
#
# The multi-arch build itself is defined once in .github/actions/build-image and
# reused by this job (and by ci.yml's build-only check). Credentials come from
# the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets.
name: Publish

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege: reading the repo is all this job needs. Registry auth is
# handled with the Docker Hub secrets, not the GITHUB_TOKEN.
permissions:
  contents: read

# Serialize builds per ref. Distinct release tags have distinct refs so they
# never cancel each other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Tagged release → Docker Hub (:<version> + :latest)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history to verify the tag is on main)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag can be pushed from any commit; a release must come from main.
      # Fetch main and confirm the tagged commit is an ancestor of its tip
      # before building anything.
      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to publish a release."
            exit 1
          fi

      # <dockerhub-user>/scrye:<version> uses the tag without its leading "v"
      # (v1.4.0 -> 1.4.0).
      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (:<version> + :latest)
        uses: ./.github/actions/build-image
        with:
          push: "true"
          cache-scope: multiarch
          tags: |
            <dockerhub-user>/scrye:${{ steps.version.outputs.version }}
            <dockerhub-user>/scrye:latest
