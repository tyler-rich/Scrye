# Scrye — release publishing to GHCR (tagged releases only).
#
# Releases publish to the GitHub Container Registry (GHCR) at
# ghcr.io/iamgroot60/scrye (CLAUDE.md locked decision §6). A push of a semver
# tag (v*.*.*) builds the multi-arch image and pushes it as
# ghcr.io/iamgroot60/scrye:<version> (the tag without its leading "v") and
# ghcr.io/iamgroot60/scrye:latest. The release job refuses to run unless the
# tagged commit is reachable from main, so only real releases cut from main ever
# reach :<version>/:latest.
#
# The moving :dev tag is published separately by dev-nightly.yml (a nightly
# schedule build of the dev branch). Both workflows push to the SAME GHCR
# package with the SAME built-in GITHUB_TOKEN — there are no Docker Hub or other
# registry credentials anywhere in the repo. Because publishing is triggered by
# a tag push (base-repo context) and authenticated with GITHUB_TOKEN, there is
# no pull_request-triggered secret path a fork PR could exploit (audit INF-2 is
# fully retired — see docs/ARCHIVE.md § Deviations).
#
# The multi-arch build itself is defined once in .github/actions/build-image and
# reused by this job (and by ci.yml's build-only check).
name: Publish

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege: contents:read to check out and verify the tag is on main;
# packages:write so the built-in GITHUB_TOKEN can push to GHCR. No repo secrets.
permissions:
  contents: read
  packages: write

# Serialize builds per ref. Distinct release tags have distinct refs so they
# never cancel each other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Tagged release → GHCR (:<version> + :latest)
    # Only the canonical repo publishes; a fork that pushes a tag (with Actions
    # enabled) can never write to iamgroot60/scrye's package anyway, but guard
    # explicitly so a fork just skips instead of failing a confusing run.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'IamGroot60/Scrye'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history to verify the tag is on main)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag can be pushed from any commit; a release must come from main.
      # Fetch main and confirm the tagged commit is an ancestor of its tip
      # before building anything.
      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to publish a release."
            exit 1
          fi

      # ghcr.io/iamgroot60/scrye:<version> uses the tag without its leading "v"
      # (v1.4.0 -> 1.4.0).
      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (:<version> + :latest)
        uses: ./.github/actions/build-image
        with:
          push: "true"
          # WRITE the multiarch scope; also READ the nightly dev-multiarch scope.
          # A release is promoted dev, so the daily nightly build usually carries
          # bit-identical layers — reading it lets a tagged release restore warm
          # arm64 layers instead of a cold QEMU rebuild. See docs/ARCHIVE.md §
          # Build performance.
          cache-scope: multiarch
          extra-cache-scopes: dev-multiarch
          tags: |
            ghcr.io/iamgroot60/scrye:${{ steps.version.outputs.version }}
            ghcr.io/iamgroot60/scrye:latest
